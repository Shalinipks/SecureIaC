name: SecureIaC Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Checkov
        run: |
          pip install checkov

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Install Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run SecureIaC Guardrail Engine
        run: |
          python engine/guardrail_engine.py

      - name: Upload SecureIaC Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureiac-security-report
          path: reports/guardrail_report.txt